name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan to catch newly-leaked patterns over old commits
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # Note: GitHub also runs its own native secret scanning on public repos
  # (Settings → Code security → Secret scanning). This workflow is just
  # belt-and-suspenders — catches commit-time pushes before merge.
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # On main pushes, scan the full history (default depth: 0 = all).
          # On PRs, the action auto-detects the diff range.
          path: ./
          extra_args: --results=verified,unknown

  # Dependency advisories. Dependabot opens PRs for known-vulnerable crates;
  # this fails the build so one can't be merged past unnoticed.
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
